<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: Anton;
    src: url("file:///workspace/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: Inter;
    src: url("file:///workspace/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2");
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #f4f1ea; }
  body { font-family: Inter, sans-serif; color: #0b0b0b; }
  .bar { height: 46px; background: #0b0b0b; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; font-weight: 700; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; }
  .dot { color: #e3120b; }
  .stage { height: 584px; display: grid; grid-template-columns: 1fr 280px; }
  .copy { padding: 64px 56px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 148px; line-height: 0.84; letter-spacing: -0.01em; }
  h1 span { color: #e3120b; }
  .tagline { margin-top: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-size: 22px; }
  .desc { max-width: 640px; font-size: 26px; line-height: 1.35; font-weight: 500; color: #2a2926; }
  .art { background: #e3120b; position: relative; overflow: hidden; }
  .circle { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: #f4f1ea; left: -70px; top: 70px; }
  .bars { position: absolute; top: 0; right: 36px; width: 86px; height: 62%; background: repeating-linear-gradient(90deg, #0b0b0b 0 8px, transparent 8px 18px); }
</style>
</head>
<body>
  <div class="bar"><span>Vol. 01 <span class="dot">●</span> Issue 01 <span class="dot">●</span> Autumn 2026</span><span>chouseworth.com</span></div>
  <div class="stage">
    <div class="copy">
      <h1><span>Chuck</span>Wise</h1>
      <p class="tagline">Commentary, mostly mine</p>
      <p class="desc">Essays, short takes, reviews, notes, and conversations.</p>
    </div>
    <div class="art" aria-hidden="true"><div class="circle"></div><div class="bars"></div></div>
  </div>
</body>
</html>
